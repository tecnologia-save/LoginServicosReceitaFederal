[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servicos-rf-login"
version = "0.1.1"
description = "Login automatizado no portal Serviços da Receita Federal via Patchright com suporte a certificado digital"
requires-python = ">=3.10"
dependencies = [
    "patchright",
    "python-dotenv",
    "ResolvedorCaptcha @ git+https://github.com/tecnologia-save/ResolvedorCaptcha-Python.git@2498006701c4e73d99736080fb6a2e103acbf241",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["servicos_rf_login*"]
