[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servicos-rf-login"
version = "0.1.87"
description = "Login automatizado no portal Serviços da Receita Federal via Patchright com suporte a certificado digital"
requires-python = ">=3.10"
dependencies = [
    "patchright",
    "python-dotenv",
    "ResolvedorCaptcha @ git+https://github.com/tecnologia-save/ResolvedorCaptcha-Python.git@b2e5b2ac9cf579d4b5523c29ed8eec7bb51c9c04",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["servicos_rf_login*"]

[dependency-groups]
# Ferramentas de desenvolvimento — NAO sao dependencias de runtime.
# Instalacao: pip install --group dev   (requer pip >= 25.1)
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# O pacote esta na raiz do repo; sem isto `pytest` direto nao o encontra.
pythonpath = ["."]
