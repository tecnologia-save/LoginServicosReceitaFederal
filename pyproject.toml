[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servicos-rf-login"
version = "0.1.31"
description = "Login automatizado no portal Serviços da Receita Federal via Patchright com suporte a certificado digital"
requires-python = ">=3.10"
dependencies = [
    "patchright",
    "python-dotenv",
    "ResolvedorCaptcha @ git+https://github.com/tecnologia-save/ResolvedorCaptcha-Python.git@f63485a7c4992bd1a9eab70e86e76f3f013dd44c",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["servicos_rf_login*"]

[dependency-groups]
# Ferramentas de desenvolvimento — NAO sao dependencias de runtime.
# Instalacao: pip install --group dev   (requer pip >= 25.1)
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# O pacote esta na raiz do repo; sem isto `pytest` direto nao o encontra.
pythonpath = ["."]
